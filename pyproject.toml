[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-measurement"
version = "0.1.0"
description = "Covariance measurement, nuisance controls and behavioral ledgers for Aether"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
aether-measurement = "aether_measurement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aether_measurement = ["data/*.json", "data/*.csv", "data/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
